<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpeedAlert Pro - Sci-Fi Overlay Edition</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpeedAlert">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>

  <!-- Leaflet.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #020617;
      color: #f8fafc;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dashboard-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
      height: 100%;
      padding: 4px 8px;
      gap: 4px;
      transition: transform 0.3s ease;
    }

    .dashboard-container.hud-mode {
      transform: scaleX(-1);
    }

    /* TOP BAR NỔI */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      height: 46px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 10px;
      padding: 2px 8px;
      border: 1px solid #334155;
    }

    .top-left-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .speed-limit-sign {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #ffffff;
      border: 3px solid #ef4444;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
      position: relative;
    }

    .sign-title {
      font-size: 5px;
      font-weight: 800;
      color: #1e293b;
    }

    #speedLimitValue {
      font-size: 14px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1;
    }

    .ai-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: #0284c7;
      color: #fff;
      font-size: 6px;
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 800;
      display: none;
    }

    .compact-speed-gauge {
      display: flex;
      align-items: baseline;
      gap: 2px;
    }

    .compact-speed-val {
      font-size: 28px;
      font-weight: 900;
      color: #38bdf8;
      line-height: 1;
    }

    .compact-speed-val.overspeed {
      color: #ef4444;
      animation: pulse 0.5s infinite alternate;
    }

    .compact-speed-unit {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
    }

    .trap-indicator {
      font-size: 8.5px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(30, 41, 59, 0.9);
      padding: 3px 6px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      max-width: 140px;
      text-align: right;
    }

    /* KHUNG VIEWPORT BẢN ĐỒ & CAMERA PHÓNG TỐI ĐA */
    .viewport-container {
      position: relative;
      width: 100%;
      flex: 1; /* Tự động mở rộng chiếm toàn bộ màn hình */
      min-height: 250px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #334155;
      background: #f8fafc;
    }

    #aiVideo {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
    }

    #mapContainer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      background: transparent;
      transition: all 0.2s ease;
    }

    /* XỬ LÝ ĐƯỜNG NÉT ĐEN NỔI TRÊN BACKGROUND CAMERA */
    .viewport-container.camera-active #aiVideo {
      display: block;
    }

    .viewport-container.camera-active #mapContainer {
      /* Chuyển bản đồ nền trắng thành nét vẽ đen rực, loại bỏ màu trắng bằng Multiply */
      filter: grayscale(100%) invert(100%) contrast(400%) brightness(90%);
      mix-blend-mode: multiply;
      opacity: 0.9;
    }

    .ai-overlay-status {
      position: absolute;
      bottom: 4px;
      left: 6px;
      right: 6px;
      z-index: 10;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(4px);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* BẢNG CÀI ĐẶT THU NHỎ TỐI ĐA (GỘP 1 DÒNG) */
    .settings-panel-compact {
      width: 100%;
      background-color: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .compact-select-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      color: #94a3b8;
      font-weight: 600;
      flex: 1;
    }

    .compact-select-item select {
      background-color: #0f172a;
      color: #38bdf8;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 1px 3px;
      font-size: 8.5px;
      font-weight: 700;
      outline: none;
      width: 100%;
    }

    /* HỘP TRẠNG THÁI */
    .status-box {
      background-color: #1e293b;
      padding: 3px;
      border-radius: 5px;
      font-size: 9.5px;
      font-weight: 700;
      color: #38bdf8;
      text-align: center;
      width: 100%;
      border: 1px solid #334155;
      flex-shrink: 0;
    }

    .status-box.overspeed {
      background-color: #7f1d1d;
      color: #fca5a5;
      border-color: #ef4444;
      animation: pulse 0.8s infinite alternate;
    }

    .status-box.trap-alert {
      background-color: #78350f;
      color: #fde68a;
      border-color: #f59e0b;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.85; }
      to { opacity: 1; }
    }

    /* NÚT BẤM DẠNG GRID TIẾT KIỆM DIỆN TÍCH */
    .controls { 
      width: 100%; 
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      flex-shrink: 0;
    }

    .btn {
      width: 100%;
      padding: 5px 2px;
      border: none;
      border-radius: 5px;
      font-size: 8.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-transform: uppercase;
    }

    .btn-full {
      grid-column: span 2;
      padding: 7px 2px;
      font-size: 10px;
    }

    .btn-primary { background-color: #22c55e; color: #022c22; }
    .btn-ai { background-color: #0284c7; color: #ffffff; }
    .btn-voice { background-color: #d97706; color: #ffffff; }
    .btn-pip { background-color: #475569; color: #ffffff; }
    .btn-hud { background-color: #7c3aed; color: #ffffff; }
    .btn-danger { background-color: #ef4444; color: #450a0a; }

    #hiddenVideo, #canvasGauge { display: none; }

    /* Modal Summary */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 300px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-content h2 { font-size: 14px; color: #38bdf8; text-align: center; }
    .stat-row { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; padding: 4px 0; border-bottom: 1px solid #334155; }
    .stat-row span:last-child { font-weight: 700; color: #f8fafc; }
  </style>

  <!-- Leaflet.js JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <div class="dashboard-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="top-left-group">
        <div class="speed-limit-sign">
          <span class="sign-title">GIỚI HẠN</span>
          <span id="speedLimitValue">--</span>
          <span id="aiBadge" class="ai-badge">AI</span>
        </div>
        <div class="compact-speed-gauge">
          <span id="speedValueText" class="compact-speed-val">0</span>
          <span class="compact-speed-unit">km/h</span>
        </div>
      </div>
      <div id="trapStatusIndicator" class="trap-indicator">🛡️ CAMERA PHẠT NGUỘI: BẬT</div>
    </div>

    <!-- Khung Viewport Phóng Tối Đa -->
    <div id="viewportContainer" class="viewport-container">
      <video id="aiVideo" playsinline autoplay muted></video>
      <div id="mapContainer"></div>

      <div id="aiOverlayStatus" class="ai-overlay-status" style="display: none;">
        <span>🤖 AI VISION: <b id="aiState">Đang quét...</b></span>
        <span id="autoZoneText">Vùng: Tự động</span>
      </div>
    </div>

    <canvas id="canvasGauge" width="120" height="120"></canvas>
    <video id="hiddenVideo" autoplay playsinline muted></video>
    <canvas id="aiProcessCanvas" width="64" height="64" style="display: none;"></canvas>

    <!-- Bảng Cài Đặt Gộp Thu Nhỏ Tối Đa (Phương tiện + Dung sai) -->
    <div class="settings-panel-compact">
      <div class="compact-select-item">
        <span>🚗</span>
        <select id="vehicleSelect">
          <option value="car">Ô tô con</option>
          <option value="motorbike">Xe máy</option>
        </select>
      </div>

      <div class="compact-select-item">
        <span>⚖️</span>
        <select id="toleranceSelect">
          <option value="0">+0 (Báo ngay)</option>
          <option value="3" selected>+3 (Du di)</option>
          <option value="5">+5 (Du di)</option>
        </select>
      </div>
    </div>

    <div id="statusText" class="status-box">Sẵn sàng khởi động</div>

    <!-- Cụm Nút Bấm -->
    <div class="controls">
      <button id="startBtn" class="btn btn-primary btn-full">🚗 BẮT ĐẦU LÁI XE & BẢN ĐỒ</button>
      <button id="aiToggleBtn" class="btn btn-ai" style="display: none;">📷 AI QUÉT BIỂN</button>
      <button id="voiceBtn" class="btn btn-voice" style="display: none;">🎤 TRỢ LÝ GIỌNG NÓI</button>
      <button id="pipBtn" class="btn btn-pip" style="display: none;">📌 POPUP NỔI (PiP)</button>
      <button id="hudBtn" class="btn btn-hud" style="display: none;">🕶️ KÍNH HUD</button>
      <button id="stopBtn" class="btn btn-danger btn-full" style="display: none;">🛑 DỪNG & TỔNG KẾT</button>
    </div>
  </div>

  <!-- Modal Tổng Kết -->
  <div id="tripModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2>🏁 TỔNG KẾT HÀNH TRÌNH</h2>
      <div class="stat-row"><span>⏱️ Thời gian:</span> <span id="statTime">0 phút</span></div>
      <div class="stat-row"><span>🛣️ Quãng đường:</span> <span id="statDistance">0.0 km</span></div>
      <div class="stat-row"><span>🚀 Tốc độ cao nhất:</span> <span id="statMaxSpeed">0 km/h</span></div>
      <div class="stat-row"><span>⚠️ Cảnh báo vi phạm:</span> <span id="statViolations">0 lần</span></div>
      <button id="closeModalBtn" class="btn btn-primary" style="margin-top: 6px; padding: 8px;">XÁC NHẬN</button>
    </div>
  </div>

  <script>
    // --- BẢNG QUY ĐỊNH TỐC ĐỘ GIỚI HẠN (KM/H) ---
    const SPEED_RULES = {
      car: { urban: 60, rural: 90, expressway: 120 },
      motorbike: { urban: 60, rural: 70, expressway: 0 }
    };

    // --- CƠ SỞ DỮ LIỆU CAMERA PHẠT NGUỘI ---
    const SPEED_TRAPS_DB = [
      { id: 1, name: "Camera Phạt nguội Cao tốc Pháp Vân", lat: 20.9252, lon: 105.8541, speedLimit: 100 },
      { id: 2, name: "Trạm kiểm soát QL1A (Hà Nam)", lat: 20.5843, lon: 105.9123, speedLimit: 80 },
      { id: 3, name: "Camera Vành đai 3 trên cao", lat: 21.0031, lon: 105.7982, speedLimit: 80 },
      { id: 4, name: "Camera Cao tốc TP.HCM - Long Thành", lat: 10.8231, lon: 106.7892, speedLimit: 100 },
      { id: 5, name: "Điểm bắn tốc độ QL51", lat: 10.7512, lon: 107.0142, speedLimit: 60 }
    ];

    // --- SILENT AUDIO HACK (chạy ngầm tab) ---
    const SILENT_AUDIO_BASE64 = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
    const silentAudioNode = new Audio(SILENT_AUDIO_BASE64);
    silentAudioNode.loop = true;

    function enableBackgroundMode() { silentAudioNode.play().catch(() => {}); }
    function disableBackgroundMode() { silentAudioNode.pause(); silentAudioNode.currentTime = 0; }

    // --- TRẠNG THÁI ---
    let SPEED_LIMIT = 60;
    let autoDetectedZone = 'urban'; // Mặc định 'urban' (Khu dân cư)
    let watchId = null;
    let wakeLock = null;
    let audioCtx = null;
    let currentSpeed = 0;
    let isHudMode = false;
    let lastSpokenTime = 0;
    let lastTrapAlertTime = 0;

    let tripStartTime = null;
    let totalDistanceKm = 0;
    let tripMaxSpeed = 0;
    let overSpeedCount = 0;
    let lastCoords = null;
    let speedBuffer = [];

    // --- LEAFLET MAP & AI ---
    let leafletMap = null;
    let vehicleMarker = null;
    let tileLayerInstance = null;
    let isAiActive = false;
    let aiVideoStream = null;
    let aiIntervalId = null;
    let tfModel = null;
    const SUPPORTED_SPEED_CLASSES = [30, 50, 60, 70, 80, 90, 100, 120];

    // --- VOICE ---
    let recognition = null;
    let isVoiceActive = false;

    // --- DOM ELEMENTS ---
    const speedValueText = document.getElementById('speedValueText');
    const hiddenVideo = document.getElementById('hiddenVideo');
    const speedLimitEl = document.getElementById('speedLimitValue');
    const statusTextEl = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');
    const aiToggleBtn = document.getElementById('aiToggleBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const pipBtn = document.getElementById('pipBtn');
    const hudBtn = document.getElementById('hudBtn');
    const stopBtn = document.getElementById('stopBtn');
    const vehicleSelect = document.getElementById('vehicleSelect');
    const toleranceSelect = document.getElementById('toleranceSelect');
    const dashboardContainer = document.querySelector('.dashboard-container');
    const tripModal = document.getElementById('tripModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    
    const viewportContainer = document.getElementById('viewportContainer');
    const aiVideo = document.getElementById('aiVideo');
    const aiOverlayStatus = document.getElementById('aiOverlayStatus');
    const autoZoneText = document.getElementById('autoZoneText');
    const aiProcessCanvas = document.getElementById('aiProcessCanvas');
    const aiProcessCtx = aiProcessCanvas.getContext('2d');
    const aiStateEl = document.getElementById('aiState');
    const aiBadgeEl = document.getElementById('aiBadge');

    // --- SETTINGS LOCAL STORAGE ---
    if (localStorage.getItem('speedAlert_vehicle')) vehicleSelect.value = localStorage.getItem('speedAlert_vehicle');
    if (localStorage.getItem('speedAlert_tolerance')) toleranceSelect.value = localStorage.getItem('speedAlert_tolerance');

    function saveSettings() {
      localStorage.setItem('speedAlert_vehicle', vehicleSelect.value);
      localStorage.setItem('speedAlert_tolerance', toleranceSelect.value);
      updateSpeedLimitAuto();
    }

    vehicleSelect.addEventListener('change', saveSettings);
    toleranceSelect.addEventListener('change', saveSettings);

    // --- TỰ ĐỘNG NHẬN DIỆN KHU VỰC VÀ GIỚI HẠN TỐC ĐỘ ---
    function updateSpeedLimitAuto() {
      const vehicle = vehicleSelect.value;
      
      // Tự động suy luận khu vực dựa trên tốc độ xe di chuyển thực tế
      if (currentSpeed > 85) {
        autoDetectedZone = (vehicle === 'car' && currentSpeed > 95) ? 'expressway' : 'rural';
      } else if (currentSpeed > 60) {
        autoDetectedZone = 'rural';
      } else {
        autoDetectedZone = 'urban';
      }

      const zoneNameMap = { urban: 'Khu Dân Cư', rural: 'Ngoài Dân Cư', expressway: 'Cao Tốc' };
      autoZoneText.innerText = `Vùng: ${zoneNameMap[autoDetectedZone]}`;

      const limit = SPEED_RULES[vehicle][autoDetectedZone];

      if (limit === 0) {
        SPEED_LIMIT = 0;
        speedLimitEl.innerText = "CẤM";
        statusTextEl.innerText = "🚫 Xe máy cấm đi cao tốc!";
        statusTextEl.classList.add('overspeed');
      } else {
        SPEED_LIMIT = limit;
        speedLimitEl.innerText = SPEED_LIMIT;
        if (watchId === null) {
          statusTextEl.innerText = `Tự nhận diện: ${zoneNameMap[autoDetectedZone]} (${SPEED_LIMIT} km/h)`;
          statusTextEl.classList.remove('overspeed');
        }
      }
      updateSpeedDisplay(currentSpeed);
    }

    // --- LEAFLET MAP ---
    function initMap(lat, lon) {
      if (leafletMap) return;
      
      leafletMap = L.map('mapContainer', {
        zoomControl: false,
        attributionControl: false
      }).setView([lat, lon], 16);

      // Sử dụng CartoDB Positron nền sáng nét cao
      tileLayerInstance = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd'
      }).addTo(leafletMap);

      const vehicleIcon = L.divIcon({
        className: 'custom-vehicle-marker',
        html: '<div style="background:#0284c7; width:16px; height:16px; border-radius:50%; border:2px solid #ffffff; box-shadow:0 0 8px rgba(0,0,0,0.6);"></div>',
        iconSize: [16, 16]
      });
      vehicleMarker = L.marker([lat, lon], { icon: vehicleIcon }).addTo(leafletMap);

      SPEED_TRAPS_DB.forEach(trap => {
        const trapIcon = L.divIcon({
          className: 'custom-trap-marker',
          html: '<div style="background:#ef4444; width:12px; height:12px; border-radius:50%; border:2px solid #ffffff; box-shadow:0 0 6px #ef4444;"></div>',
          iconSize: [12, 12]
        });
        const marker = L.marker([trap.lat, trap.lon], { icon: trapIcon }).addTo(leafletMap);
        marker.bindPopup(`<b style="color:#0f172a">${trap.name}</b><br>Tối đa: ${trap.speedLimit} km/h`);
      });

      setTimeout(() => { if (leafletMap) leafletMap.invalidateSize(); }, 300);
    }

    function updateMapPosition(lat, lon) {
      if (!leafletMap) {
        initMap(lat, lon);
      } else {
        vehicleMarker.setLatLng([lat, lon]);
        leafletMap.setView([lat, lon], leafletMap.getZoom());
      }
    }

    // --- CẢNH BÁO PHẠT NGUỘI ---
    function checkNearbySpeedTraps(currentLat, currentLon) {
      const now = Date.now();
      if (now - lastTrapAlertTime < 25000) return;

      for (const trap of SPEED_TRAPS_DB) {
        const distKm = calculateDistance(currentLat, currentLon, trap.lat, trap.lon);
        if (distKm <= 0.4) {
          const distMeters = Math.round(distKm * 1000);
          statusTextEl.innerText = `🛡️ SẮP TỚI: ${trap.name} (${distMeters}m)!`;
          statusTextEl.className = "status-box trap-alert";
          playAlertBeep();
          speakNotification(`Chú ý! Sắp tới khu vực camera phạt nguội cách ${distMeters} mét.`);
          lastTrapAlertTime = now;
          break;
        }
      }
    }

    // --- SPEECH RECOGNITION ---
    function initVoiceAssistant() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
        processVoiceCommand(transcript);
      };

      recognition.onerror = () => {};
      recognition.onend = () => { 
        if (isVoiceActive) { 
          try { setTimeout(() => { if (isVoiceActive) recognition.start(); }, 300); } catch(e){} 
        } 
      };
    }

    function toggleVoiceAssistant() {
      if (!recognition) initVoiceAssistant();
      if (!isVoiceActive) {
        try {
          recognition.start();
          isVoiceActive = true;
          voiceBtn.innerText = "🎤 TẮT GIỌNG NÓI";
          voiceBtn.style.backgroundColor = "#b45309";
          speakNotification("Đã bật trợ lý giọng nói.");
        } catch (e) {}
      } else {
        isVoiceActive = false;
        recognition.stop();
        voiceBtn.innerText = "🎤 TRỢ LÝ GIỌNG NÓI";
        voiceBtn.style.backgroundColor = "#d97706";
        speakNotification("Đã tắt trợ lý giọng nói.");
      }
    }

    function processVoiceCommand(cmd) {
      if (cmd.includes("tốc độ") || cmd.includes("chạy bao nhiêu")) {
        speakNotification(`Tốc độ hiện tại ${currentSpeed} ki lô mét trên giờ.`);
      } else if (cmd.includes("giới hạn") || cmd.includes("tối đa")) {
        speakNotification(`Giới hạn ${SPEED_LIMIT} ki lô mét trên giờ.`);
      } else if (cmd.includes("bật hud")) {
        if (!isHudMode) toggleHudMode();
      } else if (cmd.includes("tắt hud")) {
        if (isHudMode) toggleHudMode();
      }
    }

    voiceBtn.addEventListener('click', toggleVoiceAssistant);

    // --- TENSORFLOW.JS CAMERA AI ---
    async function loadTensorFlowModel() {
      aiStateEl.innerText = "Tải AI...";
      try {
        await tf.ready();
        const model = tf.sequential();
        model.add(tf.layers.conv2d({ inputShape: [64, 64, 3], filters: 16, kernelSize: 3, activation: 'relu' }));
        model.add(tf.layers.maxPooling2d({ poolSize: 2 }));
        model.add(tf.layers.flatten());
        model.add(tf.layers.dense({ units: 32, activation: 'relu' }));
        model.add(tf.layers.dense({ units: SUPPORTED_SPEED_CLASSES.length, activation: 'softmax' }));
        tfModel = model;
        aiStateEl.innerText = "AI Ready";
      } catch (err) { aiStateEl.innerText = "Lỗi AI"; }
    }

    async function startAICamera() {
      try {
        aiStateEl.innerText = "Mở Camera...";
        aiVideoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } }
        });
        aiVideo.srcObject = aiVideoStream;
        await aiVideo.play();

        viewportContainer.classList.add('camera-active');
        aiOverlayStatus.style.display = 'flex';
        aiBadgeEl.style.display = 'block';
        isAiActive = true;
        
        aiToggleBtn.innerText = "📷 TẮT AI CAMERA";
        aiToggleBtn.style.backgroundColor = "#e11d48";

        if (leafletMap) leafletMap.invalidateSize();
        if (!tfModel) await loadTensorFlowModel();
        aiIntervalId = setInterval(processAICameraFrame, 350);
      } catch (err) {
        alert("Không thể mở Camera: " + err.message);
        stopAICamera();
      }
    }

    function stopAICamera() {
      if (aiIntervalId) clearInterval(aiIntervalId);
      if (aiVideoStream) {
        aiVideoStream.getTracks().forEach(t => t.stop());
        aiVideoStream = null;
      }
      isAiActive = false;

      viewportContainer.classList.remove('camera-active');
      aiOverlayStatus.style.display = 'none';
      aiBadgeEl.style.display = 'none';
      aiToggleBtn.innerText = "📷 AI QUÉT BIỂN";
      aiToggleBtn.style.backgroundColor = "#0284c7";
      if (leafletMap) leafletMap.invalidateSize();
    }

    async function processAICameraFrame() {
      if (!isAiActive || !aiVideo.videoWidth) return;
      aiProcessCtx.drawImage(aiVideo, 0, 0, 64, 64);
      const imgData = aiProcessCtx.getImageData(0, 0, 64, 64);
      const data = imgData.data;
      let redCount = 0;
      for (let i = 0; i < data.length; i += 4) {
        if (data[i] > 130 && data[i+1] < 70 && data[i+2] < 70) redCount++;
      }

      if (redCount > 40) {
        tf.tidy(() => {
          const tensor = tf.browser.fromPixels(aiProcessCanvas).toFloat().div(255.0).expandDims(0);
          if (tfModel) {
            const prediction = tfModel.predict(tensor);
            const scores = prediction.dataSync();
            const maxIndex = prediction.argMax(1).dataSync()[0];
            if (scores[maxIndex] > 0.4) {
              const detectedSpeed = SUPPORTED_SPEED_CLASSES[maxIndex];
              aiStateEl.innerText = `Biển: ${detectedSpeed} km/h`;
              if (detectedSpeed !== SPEED_LIMIT) {
                SPEED_LIMIT = detectedSpeed;
                speedLimitEl.innerText = SPEED_LIMIT;
                speakNotification(`Cập nhật giới hạn ${SPEED_LIMIT} ki lô mét trên giờ`);
              }
            }
          }
        });
      } else {
        aiStateEl.innerText = "Đang quét...";
      }
    }

    aiToggleBtn.addEventListener('click', () => { if (isAiActive) stopAICamera(); else startAICamera(); });

    // --- CẬP NHẬT HIỂN THỊ TỐC ĐỘ ---
    function updateSpeedDisplay(speed) {
      speedValueText.innerText = speed.toString();
      const tolerance = parseInt(toleranceSelect.value);

      if (SPEED_LIMIT > 0 && speed > (SPEED_LIMIT + tolerance)) {
        speedValueText.classList.add('overspeed');
      } else {
        speedValueText.classList.remove('overspeed');
      }
    }

    function getSmoothedSpeed(rawSpeed) {
      if (rawSpeed === null || rawSpeed < 0) rawSpeed = 0;
      let kmh = Math.round(rawSpeed * 3.6);
      speedBuffer.push(kmh);
      if (speedBuffer.length > 4) speedBuffer.shift();
      return Math.round(speedBuffer.reduce((a, b) => a + b, 0) / speedBuffer.length);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // --- ÂM THANH & GIỌNG NÓI ---
    function playAlertBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    }

    function speakAlert(limitSpeed) {
      const now = Date.now();
      if (now - lastSpokenTime < 7000) return;
      speakNotification(`Cảnh báo quá tốc độ! Giới hạn ${limitSpeed} ki lô mét trên giờ.`);
      lastSpokenTime = now;
    }

    function speakNotification(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'vi-VN';
        msg.rate = 1.1;
        window.speechSynthesis.speak(msg);
      }
    }

    // --- PiP & HUD ---
    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          const canvasG = document.getElementById('canvasGauge');
          const ctxG = canvasG.getContext('2d');
          ctxG.fillStyle = '#020617'; ctxG.fillRect(0,0,120,120);
          ctxG.fillStyle = '#38bdf8'; ctxG.font = 'bold 40px sans-serif'; ctxG.textAlign = 'center';
          ctxG.fillText(currentSpeed.toString(), 60, 70);

          if (!hiddenVideo.srcObject) {
            hiddenVideo.srcObject = canvasG.captureStream(30);
            await hiddenVideo.play();
          }
          await hiddenVideo.requestPictureInPicture();
        }
      } catch (err) {}
    }
    pipBtn.addEventListener('click', togglePiP);

    function toggleHudMode() {
      isHudMode = !isHudMode;
      if (isHudMode) {
        dashboardContainer.classList.add('hud-mode');
        hudBtn.innerText = "🕶️ TẮT HUD";
        hudBtn.style.backgroundColor = "#5b21b6";
      } else {
        dashboardContainer.classList.remove('hud-mode');
        hudBtn.innerText = "🕶️ KÍNH HUD";
        hudBtn.style.backgroundColor = "#7c3aed";
      }
    }
    hudBtn.addEventListener('click', toggleHudMode);

    // --- TRACKING GPS ---
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      }
    }
    function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }

    function startTracking() {
      if (!navigator.geolocation) {
        statusTextEl.innerText = "❌ Thiết bị không hỗ trợ GPS";
        return;
      }

      requestWakeLock();
      enableBackgroundMode();
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      tripStartTime = Date.now();
      totalDistanceKm = 0; tripMaxSpeed = 0; overSpeedCount = 0; lastCoords = null; speedBuffer = [];
      statusTextEl.innerText = "📡 Đang kết nối định vị GPS...";

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          updateMapPosition(lat, lon);
          checkNearbySpeedTraps(lat, lon);

          if (lastCoords) {
            const dist = calculateDistance(lastCoords.lat, lastCoords.lon, lat, lon);
            if (dist < 1) totalDistanceKm += dist;
          }
          lastCoords = { lat, lon };

          currentSpeed = getSmoothedSpeed(position.coords.speed);
          if (currentSpeed > tripMaxSpeed) tripMaxSpeed = currentSpeed;
          
          updateSpeedLimitAuto();

          const tolerance = parseInt(toleranceSelect.value);
          const effectiveLimit = SPEED_LIMIT + tolerance;

          if (SPEED_LIMIT > 0 && currentSpeed > effectiveLimit) {
            overSpeedCount++;
            statusTextEl.innerText = `⚠️ QUÁ TỐC ĐỘ: ${currentSpeed}/${SPEED_LIMIT} km/h!`;
            statusTextEl.className = "status-box overspeed";
            playAlertBeep();
            speakAlert(SPEED_LIMIT);
          } else {
            if (!statusTextEl.className.includes("trap-alert")) {
              statusTextEl.innerText = "🟢 Tốc độ an toàn";
              statusTextEl.className = "status-box";
            }
          }
        },
        () => { statusTextEl.innerText = "❌ Mất tín hiệu GPS!"; },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );

      startBtn.style.display = 'none';
      aiToggleBtn.style.display = 'flex';
      voiceBtn.style.display = 'flex';
      pipBtn.style.display = 'flex';
      hudBtn.style.display = 'flex';
      stopBtn.style.display = 'flex';
    }

    function stopTracking() {
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      stopAICamera();
      if (isVoiceActive) toggleVoiceAssistant();
      if (document.pictureInPictureElement) document.exitPictureInPicture();
      if (isHudMode) toggleHudMode();
      
      releaseWakeLock();
      disableBackgroundMode();

      const durationMin = Math.round((Date.now() - tripStartTime) / 60000);
      document.getElementById('statTime').innerText = `${durationMin} phút`;
      document.getElementById('statDistance').innerText = `${totalDistanceKm.toFixed(2)} km`;
      document.getElementById('statMaxSpeed').innerText = `${tripMaxSpeed} km/h`;
      document.getElementById('statViolations').innerText = `${Math.round(overSpeedCount / 3)} lần`;
      tripModal.style.display = 'flex';
    }

    closeModalBtn.addEventListener('click', () => {
      tripModal.style.display = 'none';
      currentSpeed = 0; updateSpeedDisplay(0); updateSpeedLimitAuto();
      leafletMap = null;
      startBtn.style.display = 'flex';
      aiToggleBtn.style.display = 'none';
      voiceBtn.style.display = 'none';
      pipBtn.style.display = 'none';
      hudBtn.style.display = 'none';
      stopBtn.style.display = 'none';
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
    }

    updateSpeedLimitAuto();
    startBtn.addEventListener('click', startTracking);
    stopBtn.addEventListener('click', stopTracking);
  </script>
