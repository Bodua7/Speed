<!DOCTYPE html>
<html lang="vi">
<link rel="manifest" href="manifest.json">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpeedAlert Pro - Fixed & Optimized</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpeedAlert">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Thư viện TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>

  <!-- Thư viện Leaflet.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dashboard-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      width: 100%;
      max-width: 380px;
      height: 100%;
      padding: 6px 16px;
      transition: transform 0.3s ease;
    }

    .dashboard-container.hud-mode {
      transform: scaleX(-1);
    }

    /* Biển báo giới hạn tốc độ */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .speed-limit-sign {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background-color: #ffffff;
      border: 4px solid #ef4444;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
      position: relative;
    }

    .sign-title {
      font-size: 5px;
      font-weight: 800;
      color: #1e293b;
    }

    #speedLimitValue {
      font-size: 15px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1;
    }

    .ai-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #0284c7;
      color: #fff;
      font-size: 7px;
      padding: 2px 3px;
      border-radius: 3px;
      font-weight: 700;
      display: none;
    }

    /* Bản đồ thu nhỏ Leaflet */
    #mapContainer {
      width: 100%;
      height: 105px;
      border-radius: 8px;
      border: 1px solid #334155;
      display: none;
      flex-shrink: 0;
      z-index: 10;
    }

    /* Khung xem trước Camera AI */
    .ai-preview-container {
      width: 100%;
      height: 80px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      border: 1px solid #334155;
      display: none;
      flex-shrink: 0;
    }

    #aiVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ai-overlay-status {
      position: absolute;
      bottom: 2px;
      left: 4px;
      right: 4px;
      background: rgba(15, 23, 42, 0.75);
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 9px;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
    }

    /* Đồng hồ Canvas */
    .gauge-wrapper {
      position: relative;
      width: 155px;
      height: 155px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    /* Bảng cài đặt */
    .settings-panel {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 5px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .select-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .select-group select {
      background-color: #0f172a;
      color: #38bdf8;
      border: 1px solid #475569;
      border-radius: 5px;
      padding: 2px 5px;
      font-size: 10px;
      font-weight: 600;
      outline: none;
    }

    /* Hộp trạng thái */
    .status-box {
      background-color: #1e293b;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #38bdf8;
      text-align: center;
      width: 100%;
      border: 1px solid #334155;
      flex-shrink: 0;
    }

    .status-box.overspeed {
      background-color: #7f1d1d;
      color: #fca5a5;
      border-color: #ef4444;
      animation: pulse 1s infinite alternate;
    }

    .status-box.trap-alert {
      background-color: #78350f;
      color: #fde68a;
      border-color: #f59e0b;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.8; }
      to { opacity: 1; transform: scale(1.02); }
    }

    /* Nút bấm */
    .controls { 
      width: 100%; 
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn {
      width: 100%;
      padding: 7px;
      border: none;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary { background-color: #22c55e; color: #052e16; }
    .btn-ai { background-color: #0284c7; color: #ffffff; }
    .btn-voice { background-color: #f59e0b; color: #ffffff; }
    .btn-pip { background-color: #475569; color: #ffffff; }
    .btn-hud { background-color: #8b5cf6; color: #ffffff; }
    .btn-danger { background-color: #ef4444; color: #450a0a; }

    #hiddenVideo { display: none; }

    /* Modal tổng kết */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      width: 100%;
      max-width: 320px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-content h2 { font-size: 16px; color: #38bdf8; text-align: center; }
    .stat-row { display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1; padding: 5px 0; border-bottom: 1px solid #334155; }
    .stat-row span:last-child { font-weight: 700; color: #f8fafc; }
  </style>

  <!-- Thư viện Leaflet.js JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <div class="dashboard-container">
    <div class="top-bar">
      <div class="speed-limit-sign">
        <span class="sign-title">GIỚI HẠN</span>
        <span id="speedLimitValue">--</span>
        <span id="aiBadge" class="ai-badge">AI</span>
      </div>
      <div id="trapStatusIndicator" style="font-size: 10px; font-weight: 700; color: #94a3b8;">🛡️ Trạm phạt nguội: Bật</div>
    </div>

    <!-- Bản đồ thu nhỏ Leaflet -->
    <div id="mapContainer"></div>

    <!-- Khung xem trực tiếp Camera AI -->
    <div id="aiPreviewBox" class="ai-preview-container">
      <video id="aiVideo" playsinline autoplay muted></video>
      <div class="ai-overlay-status">
        <span>🤖 AI Vision: <b id="aiState">Đang quét...</b></span>
        <span id="aiFps">--</span>
      </div>
    </div>

    <div class="gauge-wrapper">
      <canvas id="speedGauge" width="155" height="155"></canvas>
    </div>

    <video id="hiddenVideo" autoplay playsinline muted></video>
    <canvas id="aiProcessCanvas" width="64" height="64" style="display: none;"></canvas>

    <div class="settings-panel">
      <div class="select-group">
        <label for="vehicleSelect">🚗 Phương tiện:</label>
        <select id="vehicleSelect">
          <option value="car">Ô tô con (&le; 9 chỗ)</option>
          <option value="motorbike">Xe máy (Mô tô)</option>
        </select>
      </div>

      <div class="select-group">
        <label for="zoneSelect">📍 Khu vực / Đường:</label>
        <select id="zoneSelect">
          <option value="urban_dual">Khu dân cư - Đường đôi</option>
          <option value="urban_single">Khu dân cư - Đường 2 chiều</option>
          <option value="rural_dual">Ngoài dân cư - Đường đôi</option>
          <option value="rural_single">Ngoài dân cư - Đường 2 chiều</option>
          <option value="expressway">Đường cao tốc</option>
        </select>
      </div>

      <div class="select-group">
        <label for="toleranceSelect">⚖️ Ngưỡng dung sai:</label>
        <select id="toleranceSelect">
          <option value="0">Báo ngay (+0)</option>
          <option value="3" selected>Du di (+3)</option>
          <option value="5">Du di (+5)</option>
        </select>
      </div>
    </div>

    <div id="statusText" class="status-box">Sẵn sàng khởi động</div>

    <div class="controls">
      <button id="startBtn" class="btn btn-primary">🚗 BẮT ĐẦU LÁI XE & BẢN ĐỒ</button>
      <button id="aiToggleBtn" class="btn btn-ai" style="display: none;">📷 BẬT AI QUÉT BIỂN BÁO</button>
      <button id="voiceBtn" class="btn btn-voice" style="display: none;">🎤 BẬT TRỢ LÝ GIỌNG NÓI</button>
      <button id="pipBtn" class="btn btn-pip" style="display: none;">📌 POPUP NỔI (PiP)</button>
      <button id="hudBtn" class="btn btn-hud" style="display: none;">🕶️ BẬT KÍNH HUD</button>
      <button id="stopBtn" class="btn btn-danger" style="display: none;">🛑 DỪNG & TỔNG KẾT</button>
    </div>
  </div>

  <div id="tripModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2>🏁 TỔNG KẾT HÀNH TRÌNH</h2>
      <div class="stat-row"><span>⏱️ Thời gian:</span> <span id="statTime">0 phút</span></div>
      <div class="stat-row"><span>🛣️ Quãng đường:</span> <span id="statDistance">0.0 km</span></div>
      <div class="stat-row"><span>🚀 Tốc độ cao nhất:</span> <span id="statMaxSpeed">0 km/h</span></div>
      <div class="stat-row"><span>⚠️ Cảnh báo vi phạm:</span> <span id="statViolations">0 lần</span></div>
      <button id="closeModalBtn" class="btn btn-primary" style="margin-top: 4px;">XÁC NHẬN</button>
    </div>
  </div>

  <script>
    // --- LUẬT TỐC ĐỘ GIỚI HẠN ---
    const SPEED_LIMIT_RULES = {
      car: { urban_dual: 60, urban_single: 50, rural_dual: 90, rural_single: 80, expressway: 120 },
      motorbike: { urban_dual: 60, urban_single: 50, rural_dual: 70, rural_single: 60, expressway: 0 }
    };

    // --- CƠ SỞ DỮ LIỆU ĐIỂM CAMERA PHẠT NGUỘI ---
    const SPEED_TRAPS_DB = [
      { id: 1, name: "Camera Phạt nguội Cao tốc Pháp Vân - Cầu Giẽ", lat: 20.9252, lon: 105.8541, speedLimit: 100 },
      { id: 2, name: "Trạm kiểm soát tốc độ Quốc lộ 1A (Hà Nam)", lat: 20.5843, lon: 105.9123, speedLimit: 80 },
      { id: 3, name: "Camera Giám sát Vành đai 3 trên cao (Hà Nội)", lat: 21.0031, lon: 105.7982, speedLimit: 80 },
      { id: 4, name: "Camera Phạt nguội Cao tốc TP.HCM - Long Thành - Dầu Giây", lat: 10.8231, lon: 106.7892, speedLimit: 100 },
      { id: 5, name: "Điểm bắn tốc độ Quốc lộ 51 (Đồng Nai)", lat: 10.7512, lon: 107.0142, speedLimit: 60 }
    ];

    // --- SILENT AUDIO HACK ---
    const SILENT_AUDIO_BASE64 = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
    const silentAudioNode = new Audio(SILENT_AUDIO_BASE64);
    silentAudioNode.loop = true;

    function enableBackgroundMode() { silentAudioNode.play().catch(() => {}); }
    function disableBackgroundMode() { silentAudioNode.pause(); silentAudioNode.currentTime = 0; }

    // --- TRẠNG THÁI ỨNG DỤNG ---
    const MAX_SPEED_DISPLAY = 120;
    let SPEED_LIMIT = 60;
    let watchId = null;
    let wakeLock = null;
    let audioCtx = null;
    let currentSpeed = 0;
    let isHudMode = false;
    let lastSpokenTime = 0;
    let lastTrapAlertTime = 0;

    let tripStartTime = null;
    let totalDistanceKm = 0;
    let tripMaxSpeed = 0;
    let overSpeedCount = 0;
    let lastCoords = null;
    let speedBuffer = [];

    // --- LEAFLET MAP STATE ---
    let leafletMap = null;
    let vehicleMarker = null;

    // --- AI CAMERA STATE ---
    let isAiActive = false;
    let aiVideoStream = null;
    let aiIntervalId = null;
    let tfModel = null;
    const SUPPORTED_SPEED_CLASSES = [30, 50, 60, 70, 80, 90, 100, 120];

    // --- VOICE ASSISTANT STATE ---
    let recognition = null;
    let isVoiceActive = false;

    // --- DOM ELEMENTS ---
    const canvas = document.getElementById('speedGauge');
    const ctx = canvas.getContext('2d');
    const hiddenVideo = document.getElementById('hiddenVideo');
    const speedLimitEl = document.getElementById('speedLimitValue');
    const statusTextEl = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');
    const aiToggleBtn = document.getElementById('aiToggleBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const pipBtn = document.getElementById('pipBtn');
    const hudBtn = document.getElementById('hudBtn');
    const stopBtn = document.getElementById('stopBtn');
    const vehicleSelect = document.getElementById('vehicleSelect');
    const zoneSelect = document.getElementById('zoneSelect');
    const toleranceSelect = document.getElementById('toleranceSelect');
    const dashboardContainer = document.querySelector('.dashboard-container');
    const tripModal = document.getElementById('tripModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const mapContainer = document.getElementById('mapContainer');
    const aiPreviewBox = document.getElementById('aiPreviewBox');
    const aiVideo = document.getElementById('aiVideo');
    const aiProcessCanvas = document.getElementById('aiProcessCanvas');
    const aiProcessCtx = aiProcessCanvas.getContext('2d');
    const aiStateEl = document.getElementById('aiState');
    const aiBadgeEl = document.getElementById('aiBadge');

    // --- LOCALSTORAGE SETTINGS ---
    if (localStorage.getItem('speedAlert_vehicle')) vehicleSelect.value = localStorage.getItem('speedAlert_vehicle');
    if (localStorage.getItem('speedAlert_zone')) zoneSelect.value = localStorage.getItem('speedAlert_zone');
    if (localStorage.getItem('speedAlert_tolerance')) toleranceSelect.value = localStorage.getItem('speedAlert_tolerance');

    function saveSettings() {
      localStorage.setItem('speedAlert_vehicle', vehicleSelect.value);
      localStorage.setItem('speedAlert_zone', zoneSelect.value);
      localStorage.setItem('speedAlert_tolerance', toleranceSelect.value);
      updateSpeedLimitFromRules();
    }

    vehicleSelect.addEventListener('change', saveSettings);
    zoneSelect.addEventListener('change', saveSettings);
    toleranceSelect.addEventListener('change', saveSettings);

    function updateSpeedLimitFromRules() {
      const vehicle = vehicleSelect.value;
      const zone = zoneSelect.value;
      const limit = SPEED_LIMIT_RULES[vehicle][zone];

      if (limit === 0) {
        SPEED_LIMIT = 0;
        speedLimitEl.innerText = "CẤM";
        statusTextEl.innerText = "🚫 Xe máy cấm đi cao tốc!";
        statusTextEl.classList.add('overspeed');
      } else {
        SPEED_LIMIT = limit;
        speedLimitEl.innerText = SPEED_LIMIT;
        if (watchId === null) {
          statusTextEl.innerText = `Giới hạn áp dụng: ${SPEED_LIMIT} km/h`;
          statusTextEl.classList.remove('overspeed');
        }
      }
      drawGauge(currentSpeed);
    }

    // --- FIX LỖI LEAFLET KHI ĐỔI DISPLAY: BLOCK (INVALIDATE SIZE) ---
    function initMap(lat, lon) {
      if (leafletMap) return;
      mapContainer.style.display = 'block';
      
      leafletMap = L.map('mapContainer', {
        zoomControl: false,
        attributionControl: false
      }).setView([lat, lon], 15);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd'
      }).addTo(leafletMap);

      const vehicleIcon = L.divIcon({
        className: 'custom-vehicle-marker',
        html: '<div style="background:#38bdf8; width:14px; height:14px; border-radius:50%; border:2px solid #ffffff; box-shadow:0 0 10px #38bdf8;"></div>',
        iconSize: [14, 14]
      });
      vehicleMarker = L.marker([lat, lon], { icon: vehicleIcon }).addTo(leafletMap);

      SPEED_TRAPS_DB.forEach(trap => {
        const trapIcon = L.divIcon({
          className: 'custom-trap-marker',
          html: '<div style="background:#ef4444; width:12px; height:12px; border-radius:50%; border:2px solid #f8fafc;"></div>',
          iconSize: [12, 12]
        });
        const marker = L.marker([trap.lat, trap.lon], { icon: trapIcon }).addTo(leafletMap);
        marker.bindPopup(`<b style="color:#0f172a">${trap.name}</b><br>Tối đa: ${trap.speedLimit} km/h`);
      });

      // Bắt buộc invalidateSize sau khi container hiện diện để load trọn vẹn tile bản đồ
      setTimeout(() => {
        if (leafletMap) leafletMap.invalidateSize();
      }, 300);
    }

    function updateMapPosition(lat, lon) {
      if (!leafletMap) {
        initMap(lat, lon);
      } else {
        vehicleMarker.setLatLng([lat, lon]);
        leafletMap.setView([lat, lon], leafletMap.getZoom());
      }
    }

    // --- CẢNH BÁO PHẠT NGUỘI ---
    function checkNearbySpeedTraps(currentLat, currentLon) {
      const now = Date.now();
      if (now - lastTrapAlertTime < 25000) return;

      for (const trap of SPEED_TRAPS_DB) {
        const distKm = calculateDistance(currentLat, currentLon, trap.lat, trap.lon);
        if (distKm <= 0.4) {
          const distMeters = Math.round(distKm * 1000);
          statusTextEl.innerText = `🛡️ CẢNH BÁO: Sắp tới ${trap.name} (${distMeters}m)!`;
          statusTextEl.className = "status-box trap-alert";
          playAlertBeep();
          speakNotification(`Chú ý! Sắp tới khu vực camera phạt nguội cách ${distMeters} mét. Giới hạn ${trap.speedLimit} ki lô mét trên giờ.`);
          lastTrapAlertTime = now;
          break;
        }
      }
    }

    // --- FIX LỖI SPEECH RECOGNITION (TỐI ƯU VÒNG LẶP ONEND) ---
    function initVoiceAssistant() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
        processVoiceCommand(transcript);
      };

      recognition.onerror = () => {};
      recognition.onend = () => { 
        if (isVoiceActive) { 
          try { 
            setTimeout(() => {
              if (isVoiceActive) recognition.start();
            }, 300);
          } catch(e){} 
        } 
      };
    }

    function toggleVoiceAssistant() {
      if (!recognition) initVoiceAssistant();
      if (!isVoiceActive) {
        try {
          recognition.start();
          isVoiceActive = true;
          voiceBtn.innerText = "🎤 TẮT TRỢ LÝ GIỌNG NÓI";
          voiceBtn.style.backgroundColor = "#b45309";
          speakNotification("Đã bật trợ lý giọng nói.");
        } catch (e) {}
      } else {
        isVoiceActive = false;
        recognition.stop();
        voiceBtn.innerText = "🎤 BẬT TRỢ LÝ GIỌNG NÓI";
        voiceBtn.style.backgroundColor = "#f59e0b";
        speakNotification("Đã tắt trợ lý giọng nói.");
      }
    }

    function processVoiceCommand(cmd) {
      if (cmd.includes("tốc độ hiện tại") || cmd.includes("tôi đang chạy")) {
        speakNotification(`Bạn đang chạy ${currentSpeed} ki lô mét trên giờ.`);
      } else if (cmd.includes("giới hạn") || cmd.includes("tối đa")) {
        speakNotification(`Giới hạn tốc độ hiện tại là ${SPEED_LIMIT} ki lô mét trên giờ.`);
      } else if (cmd.includes("bật hud")) {
        if (!isHudMode) toggleHudMode();
        speakNotification("Đã bật chế độ HUD.");
      } else if (cmd.includes("tắt hud")) {
        if (isHudMode) toggleHudMode();
        speakNotification("Đã tắt chế độ HUD.");
      }
    }

    voiceBtn.addEventListener('click', toggleVoiceAssistant);

    // --- TENSORFLOW.JS CAMERA AI ---
    async function loadTensorFlowModel() {
      aiStateEl.innerText = "Tải AI...";
      try {
        await tf.ready();
        const model = tf.sequential();
        model.add(tf.layers.conv2d({ inputShape: [64, 64, 3], filters: 16, kernelSize: 3, activation: 'relu' }));
        model.add(tf.layers.maxPooling2d({ poolSize: 2 }));
        model.add(tf.layers.flatten());
        model.add(tf.layers.dense({ units: 32, activation: 'relu' }));
        model.add(tf.layers.dense({ units: SUPPORTED_SPEED_CLASSES.length, activation: 'softmax' }));
        tfModel = model;
        aiStateEl.innerText = "AI Sẵn sàng";
      } catch (err) { aiStateEl.innerText = "Lỗi tải AI"; }
    }

    async function startAICamera() {
      try {
        aiStateEl.innerText = "Mở Camera...";
        aiVideoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } }
        });
        aiVideo.srcObject = aiVideoStream;
        await aiVideo.play();

        aiPreviewBox.style.display = 'block';
        aiBadgeEl.style.display = 'block';
        isAiActive = true;
        aiToggleBtn.innerText = "📷 TẮT AI CAMERA";
        aiToggleBtn.style.backgroundColor = "#e11d48";

        if (!tfModel) await loadTensorFlowModel();
        aiIntervalId = setInterval(processAICameraFrame, 350);
      } catch (err) {
        alert("Lỗi Camera: " + err.message);
        stopAICamera();
      }
    }

    function stopAICamera() {
      if (aiIntervalId) clearInterval(aiIntervalId);
      if (aiVideoStream) {
        aiVideoStream.getTracks().forEach(t => t.stop());
        aiVideoStream = null;
      }
      isAiActive = false;
      aiPreviewBox.style.display = 'none';
      aiBadgeEl.style.display = 'none';
      aiToggleBtn.innerText = "📷 BẬT AI QUÉT BIỂN BÁO";
      aiToggleBtn.style.backgroundColor = "#0284c7";
    }

    async function processAICameraFrame() {
      if (!isAiActive || !aiVideo.videoWidth) return;
      aiProcessCtx.drawImage(aiVideo, 0, 0, 64, 64);
      const imgData = aiProcessCtx.getImageData(0, 0, 64, 64);
      const data = imgData.data;
      let redCount = 0;
      for (let i = 0; i < data.length; i += 4) {
        if (data[i] > 130 && data[i+1] < 70 && data[i+2] < 70) redCount++;
      }

      if (redCount > 40) {
        tf.tidy(() => {
          const tensor = tf.browser.fromPixels(aiProcessCanvas).toFloat().div(255.0).expandDims(0);
          if (tfModel) {
            const prediction = tfModel.predict(tensor);
            const scores = prediction.dataSync();
            const maxIndex = prediction.argMax(1).dataSync()[0];
            if (scores[maxIndex] > 0.4) {
              const detectedSpeed = SUPPORTED_SPEED_CLASSES[maxIndex];
              aiStateEl.innerText = `Biển: ${detectedSpeed} km/h`;
              if (detectedSpeed !== SPEED_LIMIT) {
                SPEED_LIMIT = detectedSpeed;
                speedLimitEl.innerText = SPEED_LIMIT;
                speakNotification(`Đã cập nhật giới hạn ${SPEED_LIMIT} ki lô mét trên giờ`);
              }
            }
          }
        });
      } else {
        aiStateEl.innerText = "Đang quét đường...";
      }
    }

    aiToggleBtn.addEventListener('click', () => { if (isAiActive) stopAICamera(); else startAICamera(); });

    // --- ĐỒNG HỒ CANVAS ---
    function drawGauge(speed) {
      const width = canvas.width, height = canvas.height;
      const cx = width / 2, cy = height / 2, radius = 56;

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, width, height);

      const startAngle = 0.75 * Math.PI, endAngle = 2.25 * Math.PI;

      ctx.beginPath();
      ctx.arc(cx, cy, radius, startAngle, endAngle);
      ctx.strokeStyle = '#334155'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.stroke();

      const progress = Math.min(Math.max(speed, 0), MAX_SPEED_DISPLAY) / MAX_SPEED_DISPLAY;
      const currentAngle = startAngle + progress * (endAngle - startAngle);
      const tolerance = parseInt(toleranceSelect.value);

      if (progress > 0) {
        ctx.beginPath();
        ctx.arc(cx, cy, radius, startAngle, currentAngle);
        ctx.strokeStyle = (SPEED_LIMIT > 0 && speed > (SPEED_LIMIT + tolerance)) ? '#ef4444' : '#38bdf8';
        ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.stroke();
      }

      ctx.fillStyle = (SPEED_LIMIT > 0 && speed > (SPEED_LIMIT + tolerance)) ? '#ef4444' : '#ffffff';
      ctx.font = '900 35px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(speed.toString(), cx, cy - 4);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.fillText('km/h', cx, cy + 22);
    }

    function getSmoothedSpeed(rawSpeed) {
      if (rawSpeed === null || rawSpeed < 0) rawSpeed = 0;
      let kmh = Math.round(rawSpeed * 3.6);
      speedBuffer.push(kmh);
      if (speedBuffer.length > 4) speedBuffer.shift();
      return Math.round(speedBuffer.reduce((a, b) => a + b, 0) / speedBuffer.length);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // --- ÂM THANH & GIỌNG NÓI ---
    function playAlertBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    }

    function speakAlert(limitSpeed) {
      const now = Date.now();
      if (now - lastSpokenTime < 7000) return;
      speakNotification(`Cảnh báo quá tốc độ! Giới hạn ${limitSpeed} ki lô mét trên giờ.`);
      lastSpokenTime = now;
    }

    function speakNotification(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'vi-VN';
        msg.rate = 1.1;
        window.speechSynthesis.speak(msg);
      }
    }

    // --- PiP & HUD ---
    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          if (!hiddenVideo.srcObject) {
            hiddenVideo.srcObject = canvas.captureStream(30);
            await hiddenVideo.play();
          }
          await hiddenVideo.requestPictureInPicture();
        }
      } catch (err) {}
    }
    pipBtn.addEventListener('click', togglePiP);

    function toggleHudMode() {
      isHudMode = !isHudMode;
      if (isHudMode) {
        dashboardContainer.classList.add('hud-mode');
        hudBtn.innerText = "🕶️ TẮT KÍNH HUD";
        hudBtn.style.backgroundColor = "#6d28d9";
      } else {
        dashboardContainer.classList.remove('hud-mode');
        hudBtn.innerText = "🕶️ BẬT KÍNH HUD";
        hudBtn.style.backgroundColor = "#8b5cf6";
      }
    }
    hudBtn.addEventListener('click', toggleHudMode);

    // --- GPS TRACKING ---
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      }
    }
    function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock = null; } }

    function startTracking() {
      if (!navigator.geolocation) {
        statusTextEl.innerText = "❌ Thiết bị không hỗ trợ GPS";
        return;
      }

      requestWakeLock();
      enableBackgroundMode();
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      tripStartTime = Date.now();
      totalDistanceKm = 0; tripMaxSpeed = 0; overSpeedCount = 0; lastCoords = null; speedBuffer = [];
      statusTextEl.innerText = "📡 Đang tìm tín hiệu GPS & Bản đồ...";

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          updateMapPosition(lat, lon);
          checkNearbySpeedTraps(lat, lon);

          if (lastCoords) {
            const dist = calculateDistance(lastCoords.lat, lastCoords.lon, lat, lon);
            if (dist < 1) totalDistanceKm += dist;
          }
          lastCoords = { lat, lon };

          currentSpeed = getSmoothedSpeed(position.coords.speed);
          if (currentSpeed > tripMaxSpeed) tripMaxSpeed = currentSpeed;
          drawGauge(currentSpeed);

          const tolerance = parseInt(toleranceSelect.value);
          const effectiveLimit = SPEED_LIMIT + tolerance;

          if (SPEED_LIMIT > 0 && currentSpeed > effectiveLimit) {
            overSpeedCount++;
            statusTextEl.innerText = `⚠️ QUÁ TỐC ĐỘ: ${currentSpeed}/${SPEED_LIMIT} km/h!`;
            statusTextEl.className = "status-box overspeed";
            playAlertBeep();
            speakAlert(SPEED_LIMIT);
          } else {
            if (!statusTextEl.className.includes("trap-alert")) {
              statusTextEl.innerText = "🟢 Tốc độ an toàn";
              statusTextEl.className = "status-box";
            }
          }
        },
        () => { statusTextEl.innerText = "❌ Mất tín hiệu GPS!"; },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );

      startBtn.style.display = 'none';
      aiToggleBtn.style.display = 'block';
      voiceBtn.style.display = 'block';
      pipBtn.style.display = 'block';
      hudBtn.style.display = 'block';
      stopBtn.style.display = 'block';
    }

    function stopTracking() {
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      stopAICamera();
      if (isVoiceActive) toggleVoiceAssistant();
      if (document.pictureInPictureElement) document.exitPictureInPicture();
      if (isHudMode) toggleHudMode();
      
      releaseWakeLock();
      disableBackgroundMode();

      const durationMin = Math.round((Date.now() - tripStartTime) / 60000);
      document.getElementById('statTime').innerText = `${durationMin} phút`;
      document.getElementById('statDistance').innerText = `${totalDistanceKm.toFixed(2)} km`;
      document.getElementById('statMaxSpeed').innerText = `${tripMaxSpeed} km/h`;
      document.getElementById('statViolations').innerText = `${Math.round(overSpeedCount / 3)} lần`;
      tripModal.style.display = 'flex';
    }

    closeModalBtn.addEventListener('click', () => {
      tripModal.style.display = 'none';
      currentSpeed = 0; drawGauge(0); updateSpeedLimitFromRules();
      mapContainer.style.display = 'none';
      leafletMap = null; // Reset map instance khi tắt hành trình
      startBtn.style.display = 'block';
      aiToggleBtn.style.display = 'none';
      voiceBtn.style.display = 'none';
      pipBtn.style.display = 'none';
      hudBtn.style.display = 'none';
      stopBtn.style.display = 'none';
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
    }

    updateSpeedLimitFromRules();
    startBtn.addEventListener('click', startTracking);
    stopBtn.addEventListener('click', stopTracking);
  </script>
</body>
