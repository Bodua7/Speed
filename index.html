<!DOCTYPE html>
<html lang="vi">
  <link rel="manifest" href="manifest.json">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpeedAlert Pro - Copilot AI</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpeedAlert">

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>

  <!-- Leaflet.js CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background-color: #020617; color: #f8fafc; }
    body { display: flex; justify-content: center; align-items: center; }

    .dashboard-container {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 420px; height: 100%; padding: 4px 8px; gap: 4px;
      transition: transform 0.3s ease;
    }
    .dashboard-container.hud-mode { transform: scaleX(-1); }

    /* TOP BAR */
    .top-bar {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0; height: 46px; background: rgba(15, 23, 42, 0.9);
      border-radius: 10px; padding: 2px 8px; border: 1px solid #334155; z-index: 50;
    }
    .top-left-group { display: flex; align-items: center; gap: 8px; }
    .speed-limit-sign {
      width: 38px; height: 38px; border-radius: 50%; background-color: #ffffff;
      border: 3px solid #ef4444; display: flex; flex-direction: column;
      justify-content: center; align-items: center; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
      position: relative;
    }
    .sign-title { font-size: 5px; font-weight: 800; color: #1e293b; }
    #speedLimitValue { font-size: 14px; font-weight: 900; color: #0f172a; line-height: 1; }
    .ai-badge { position: absolute; top: -3px; right: -3px; background: #0284c7; color: #fff; font-size: 6px; padding: 1px 3px; border-radius: 3px; font-weight: 800; display: none; }
    .compact-speed-gauge { display: flex; align-items: baseline; gap: 3px; }
    .compact-speed-val { font-size: 28px; font-weight: 900; color: #38bdf8; line-height: 1; }
    .compact-speed-val.overspeed { color: #ef4444; animation: pulse 0.5s infinite alternate; }
    .compact-speed-unit { font-size: 10px; font-weight: 700; color: #94a3b8; }
    .trap-indicator { font-size: 8.5px; font-weight: 700; color: #38bdf8; background: rgba(30, 41, 59, 0.9); padding: 3px 6px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.3); max-width: 130px; text-align: right; }

    /* VIEWPORT BẢN ĐỒ & CAMERA */
    .viewport-container {
      position: relative; width: 100%; flex: 1; min-height: 250px;
      border-radius: 10px; overflow: hidden; border: 1px solid #334155; background: #020617;
    }
    #aiVideo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; display: none; }
    #mapContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; transition: all 0.2s ease; }
    
    .map-theme-btn {
      position: absolute; top: 8px; right: 8px; z-index: 100;
      width: 28px; height: 28px; border-radius: 50%; background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8; display: flex;
      align-items: center; justify-content: center; font-size: 13px; cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .viewport-container.camera-active #aiVideo { display: block; }
    .viewport-container.camera-active #mapContainer { opacity: 0.95; pointer-events: none; }
    .viewport-container.camera-active #mapContainer .leaflet-tile { filter: contrast(1000%) brightness(30%) grayscale(100%); }

    .ai-overlay-status {
      position: absolute; bottom: 4px; left: 6px; right: 6px; z-index: 10;
      background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(4px); padding: 2px 6px;
      border-radius: 4px; font-size: 9px; color: #38bdf8; display: flex;
      justify-content: space-between; border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* BẢNG CÀI ĐẶT */
    .settings-panel-compact {
      width: 100%; background-color: rgba(30, 41, 59, 0.8); border: 1px solid #334155;
      border-radius: 6px; padding: 3px 6px; display: flex; justify-content: space-between;
      align-items: center; gap: 4px; flex-shrink: 0;
    }
    .compact-select-item { display: flex; align-items: center; gap: 3px; font-size: 9px; color: #94a3b8; font-weight: 600; }
    .compact-select-item select, .compact-select-item input {
      background-color: #0f172a; color: #38bdf8; border: 1px solid #475569;
      border-radius: 4px; padding: 1px 3px; font-size: 8.5px; font-weight: 700; outline: none; width: 100%;
    }
    .btn-sound-toggle { background-color: #10b981; color: #ffffff; border: none; border-radius: 4px; padding: 2px 6px; font-size: 9px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 2px; }
    .btn-sound-toggle.muted { background-color: #64748b; color: #cbd5e1; }

    /* STATUS BOX */
    .status-box {
      background-color: #1e293b; padding: 3px; border-radius: 5px; font-size: 9.5px;
      font-weight: 700; color: #38bdf8; text-align: center; width: 100%; border: 1px solid #334155; flex-shrink: 0;
    }
    .status-box.overspeed { background-color: #7f1d1d; color: #fca5a5; border-color: #ef4444; animation: pulse 0.8s infinite alternate; }
    .status-box.trap-alert { background-color: #78350f; color: #fde68a; border-color: #f59e0b; animation: pulse 0.8s infinite alternate; }
    .status-box.ai-thinking { background-color: #3b0764; color: #e9d5ff; border-color: #a855f7; }

    @keyframes pulse { from { opacity: 0.85; } to { opacity: 1; } }

    /* NÚT BẤM */
    .controls { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; flex-shrink: 0; }
    .btn { width: 100%; padding: 5px 2px; border: none; border-radius: 5px; font-size: 8.5px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 2px; text-transform: uppercase; }
    .btn-full { grid-column: span 2; padding: 7px 2px; font-size: 10px; }
    .btn-primary { background-color: #22c55e; color: #022c22; }
    .btn-ai { background-color: #0284c7; color: #ffffff; }
    .btn-voice { background-color: #d97706; color: #ffffff; }
    .btn-voice.active { background-color: #dc2626; animation: pulse 1s infinite alternate; }
    .btn-pip { background-color: #475569; color: #ffffff; }
    .btn-hud { background-color: #7c3aed; color: #ffffff; }
    .btn-danger { background-color: #ef4444; color: #450a0a; }

    #hiddenVideo, #canvasGauge { display: none; }

    /* Modal Summary */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-content { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 300px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .modal-content h2 { font-size: 14px; color: #38bdf8; text-align: center; }
    .stat-row { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; padding: 4px 0; border-bottom: 1px solid #334155; }
    .stat-row span:last-child { font-weight: 700; color: #f8fafc; }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="top-left-group">
        <div class="speed-limit-sign">
          <span class="sign-title">GIỚI HẠN</span>
          <span id="speedLimitValue">--</span>
          <span id="aiBadge" class="ai-badge">AI</span>
        </div>
        
        <div class="compact-speed-gauge">
          <span id="speedValueText" class="compact-speed-val">0</span>
          <span class="compact-speed-unit">km/h</span>
        </div>
      </div>
      <div id="trapStatusIndicator" class="trap-indicator">🛡️ CAMERA PHẠT NGUỘI: BẬT</div>
    </div>

    <!-- Viewport Bản Đồ & AI -->
    <div id="viewportContainer" class="viewport-container">
      <video id="aiVideo" playsinline autoplay muted></video>
      <div id="mapContainer"></div>

      <button id="mapThemeBtn" class="map-theme-btn" title="Đổi giao diện Ngày/Đêm">🌙</button>

      <div id="aiOverlayStatus" class="ai-overlay-status" style="display: none;">
        <span>🤖 AI VISION: <b id="aiState">Đang quét...</b></span>
        <span id="autoZoneText">Vùng: Tự động</span>
      </div>
    </div>

    <canvas id="canvasGauge" width="300" height="300"></canvas>
    <video id="hiddenVideo" autoplay playsinline muted></video>
    <canvas id="aiProcessCanvas" width="64" height="64" style="display: none;"></canvas>

    <!-- Bảng Cài Đặt -->
    <div class="settings-panel-compact">
      <div class="compact-select-item" style="max-width: 80px;">
        <span>🚗</span>
        <select id="vehicleSelect">
          <option value="car">Ô tô</option>
          <option value="motorbike">Xe máy</option>
        </select>
      </div>

      <div class="compact-select-item" style="max-width: 85px;">
        <span>⚖️</span>
        <select id="toleranceSelect">
          <option value="0">+0</option>
          <option value="3" selected>+3</option>
          <option value="5">+5</option>
        </select>
      </div>

      <button id="soundToggleBtn" class="btn-sound-toggle">
        <span id="soundIcon">🔊</span> <span id="soundText">BẬT</span>
      </button>

      <div class="compact-select-item" style="max-width: 95px;">
        <input type="text" id="aiNameInput" value="Jarvis" placeholder="Tên AI">
      </div>
    </div>

    <div id="statusText" class="status-box">Sẵn sàng khởi động</div>

    <!-- Cụm Nút Bấm -->
    <div class="controls">
      <button id="startBtn" class="btn btn-primary btn-full">🚗 BẮT ĐẦU LÁI XE & CHỈ ĐƯỜNG AI</button>
      <button id="aiToggleBtn" class="btn btn-ai" style="display: none;">📷 AI QUÉT BIỂN</button>
      <button id="voiceBtn" class="btn btn-voice" style="display: none;">🎤 AI TÁM CHUYỆN / CHỈ ĐƯỜNG</button>
      <button id="pipBtn" class="btn btn-pip" style="display: none;">📌 POPUP NỔI (PiP)</button>
      <button id="hudBtn" class="btn btn-hud" style="display: none;">🕶️ KÍNH HUD</button>
      <button id="stopBtn" class="btn btn-danger btn-full" style="display: none;">🛑 DỪNG & TỔNG KẾT</button>
    </div>
  </div>

  <!-- Modal Tổng Kết -->
  <div id="tripModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2>🏁 TỔNG KẾT HÀNH TRÌNH</h2>
      <div class="stat-row"><span>⏱️ Thời gian:</span> <span id="statTime">0 phút</span></div>
      <div class="stat-row"><span>🛣️ Quãng đường:</span> <span id="statDistance">0.0 km</span></div>
      <div class="stat-row"><span>🚀 Tốc độ cao nhất:</span> <span id="statMaxSpeed">0 km/h</span></div>
      <div class="stat-row"><span>⚠️ Cảnh báo vi phạm:</span> <span id="statViolations">0 lần</span></div>
      <button id="closeModalBtn" class="btn btn-primary" style="margin-top: 6px; padding: 8px;">XÁC NHẬN</button>
    </div>
  </div>

  <script>
    // Config Rules
    const SPEED_RULES = {
      car: { urban: 60, rural: 90, expressway: 120 },
      motorbike: { urban: 60, rural: 70, expressway: 0 }
    };

    const SPEED_TRAPS_DB = [
      { id: 1, name: "Camera Phạt nguội Cao tốc Pháp Vân", lat: 20.9252, lon: 105.8541, speedLimit: 100 },
      { id: 2, name: "Trạm kiểm soát QL1A (Hà Nam)", lat: 20.5843, lon: 105.9123, speedLimit: 80 },
      { id: 3, name: "Camera Vành đai 3 trên cao", lat: 21.0031, lon: 105.7982, speedLimit: 80 },
      { id: 4, name: "Camera Cao tốc TP.HCM - Long Thành", lat: 10.8231, lon: 106.7892, speedLimit: 100 },
      { id: 5, name: "Điểm bắn tốc độ QL51", lat: 10.7512, lon: 107.0142, speedLimit: 60 }
    ];

    const MAP_TILES = {
      darkSciFi: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      lightSciFi: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      cameraOverlay: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
    };

    // --- CẢI TIẾN CHẠY NỀN VƯỢT TRỘI (BACKGROUND CONTINUOUS ENGINE) ---
    let audioCtx = null;
    let backgroundOscillator = null;

    function enableBackgroundEngine() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        // Tạo âm thanh siêu tần số im lặng giữ cho Web Audio API luôn Active ngay cả khi tắt màn hình
        backgroundOscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        backgroundOscillator.type = 'sine';
        backgroundOscillator.frequency.setValueAtTime(20, audioCtx.currentTime); // 20Hz gần như vô thanh
        gainNode.gain.setValueAtTime(0.001, audioCtx.currentTime);
        backgroundOscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        backgroundOscillator.start();
      } catch (e) { console.log("Background engine error:", e); }
    }

    function disableBackgroundEngine() {
      if (backgroundOscillator) {
        try { backgroundOscillator.stop(); backgroundOscillator.disconnect(); } catch(e){}
        backgroundOscillator = null;
      }
    }

    // Global variables
    let SPEED_LIMIT = 60;
    let autoDetectedZone = 'urban';
    let watchId = null;
    let wakeLock = null;
    let currentSpeed = 0;
    let currentLat = 20.9252, currentLon = 105.8541;
    let isHudMode = false;
    let lastSpokenTime = 0;
    let lastTrapAlertTime = 0;
    let pipAnimationId = null;
    
    let isSoundEnabled = localStorage.getItem('speedAlert_sound') !== 'false';
    let isDarkMode = localStorage.getItem('speedAlert_mapTheme') !== 'light';

    let tripStartTime = null;
    let totalDistanceKm = 0;
    let tripMaxSpeed = 0;
    let overSpeedCount = 0;
    let lastCoords = null;
    let speedBuffer = [];

    let leafletMap = null;
    let vehicleMarker = null;
    let routePolyline = null;
    let tileLayerInstance = null;
    let isAiActive = false;
    let aiVideoStream = null;
    let aiIntervalId = null;
    let tfModel = null;
    const SUPPORTED_SPEED_CLASSES = [30, 50, 60, 70, 80, 90, 100, 120];

    let recognition = null;
    let isVoiceActive = false;

    // DOM Elements
    const speedValueText = document.getElementById('speedValueText');
    const hiddenVideo = document.getElementById('hiddenVideo');
    const canvasGauge = document.getElementById('canvasGauge');
    const ctxG = canvasGauge.getContext('2d');
    const speedLimitEl = document.getElementById('speedLimitValue');
    const statusTextEl = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');
    const aiToggleBtn = document.getElementById('aiToggleBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const pipBtn = document.getElementById('pipBtn');
    const hudBtn = document.getElementById('hudBtn');
    const stopBtn = document.getElementById('stopBtn');
    const vehicleSelect = document.getElementById('vehicleSelect');
    const toleranceSelect = document.getElementById('toleranceSelect');
    const aiNameInput = document.getElementById('aiNameInput');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');
    const dashboardContainer = document.querySelector('.dashboard-container');
    const tripModal = document.getElementById('tripModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const viewportContainer = document.getElementById('viewportContainer');
    const aiVideo = document.getElementById('aiVideo');
    const mapThemeBtn = document.getElementById('mapThemeBtn');
    const aiOverlayStatus = document.getElementById('aiOverlayStatus');
    const autoZoneText = document.getElementById('autoZoneText');
    const aiProcessCanvas = document.getElementById('aiProcessCanvas');
    const aiProcessCtx = aiProcessCanvas.getContext('2d');
    const aiStateEl = document.getElementById('aiState');
    const aiBadgeEl = document.getElementById('aiBadge');

    function updateSoundUI() {
      if (isSoundEnabled) {
        soundIcon.innerText = "🔊"; soundText.innerText = "BẬT"; soundToggleBtn.classList.remove('muted');
      } else {
        soundIcon.innerText = "🔇"; soundText.innerText = "TẮT"; soundToggleBtn.classList.add('muted');
      }
    }

    soundToggleBtn.addEventListener('click', () => {
      isSoundEnabled = !isSoundEnabled;
      localStorage.setItem('speedAlert_sound', isSoundEnabled ? 'true' : 'false');
      updateSoundUI();
    });
    updateSoundUI();

    function updateSpeedLimitAuto() {
      const vehicle = vehicleSelect.value;
      if (currentSpeed > 85) autoDetectedZone = (vehicle === 'car' && currentSpeed > 95) ? 'expressway' : 'rural';
      else if (currentSpeed > 60) autoDetectedZone = 'rural';
      else autoDetectedZone = 'urban';

      const zoneNameMap = { urban: 'Khu Dân Cư', rural: 'Ngoài Dân Cư', expressway: 'Cao Tốc' };
      autoZoneText.innerText = `Vùng: ${zoneNameMap[autoDetectedZone]}`;

      const limit = SPEED_RULES[vehicle][autoDetectedZone];
      if (limit === 0) {
        SPEED_LIMIT = 0; speedLimitEl.innerText = "CẤM";
        statusTextEl.innerText = "🚫 Xe máy cấm đi cao tốc!";
        statusTextEl.classList.add('overspeed');
      } else {
        SPEED_LIMIT = limit; speedLimitEl.innerText = SPEED_LIMIT;
        if (watchId === null) {
          statusTextEl.innerText = `Tự nhận diện: ${zoneNameMap[autoDetectedZone]} (${SPEED_LIMIT} km/h)`;
          statusTextEl.classList.remove('overspeed');
        }
      }
      updateSpeedDisplay(currentSpeed);
    }

    function initMap(lat, lon) {
      if (leafletMap) return;
      leafletMap = L.map('mapContainer', { zoomControl: false, attributionControl: false }).setView([lat, lon], 16);
      const initialTileUrl = isDarkMode ? MAP_TILES.darkSciFi : MAP_TILES.lightSciFi;
      tileLayerInstance = L.tileLayer(initialTileUrl, { maxZoom: 19 }).addTo(leafletMap);

      const vehicleIcon = L.divIcon({
        className: 'custom-vehicle-marker',
        html: '<div style="background:#ef4444; width:16px; height:16px; border-radius:50%; border:3px solid #ffffff; box-shadow:0 0 10px #ef4444;"></div>',
        iconSize: [16, 16]
      });
      vehicleMarker = L.marker([lat, lon], { icon: vehicleIcon }).addTo(leafletMap);
      setTimeout(() => { if (leafletMap) leafletMap.invalidateSize(); }, 300);
    }

    function updateMapPosition(lat, lon) {
      currentLat = lat; currentLon = lon;
      if (!leafletMap) initMap(lat, lon);
      else {
        vehicleMarker.setLatLng([lat, lon]);
        leafletMap.setView([lat, lon], leafletMap.getZoom());
      }
    }

    // --- TÍNH NĂNG AI CHỈ ĐƯỜNG (OSRM ROUTING INTEGRATION) ---
    async function routeToDestination(destinationQuery) {
      statusTextEl.innerText = `🗺️ AI Đang tìm đường tới: ${destinationQuery}...`;
      statusTextEl.className = "status-box ai-thinking";
      
      try {
        // Step 1: Geocoding địa điểm qua Nominatim OpenStreetMap
        const geoUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destinationQuery)}&limit=1`;
        const geoRes = await fetch(geoUrl);
        const geoData = await geoRes.json();

        if (!geoData || geoData.length === 0) {
          speakNotification(`Rất tiếc, tôi không tìm thấy vị trí ${destinationQuery}`);
          statusTextEl.innerText = "❌ Không tìm thấy địa điểm";
          return;
        }

        const destLat = parseFloat(geoData[0].lat);
        const destLon = parseFloat(geoData[0].lon);
        const destName = geoData[0].display_name.split(',')[0];

        // Step 2: Tính toán lộ trình lái xe qua OSRM Engine
        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${currentLon},${currentLat};${destLon},${destLat}?overview=full&geometries=geojson`;
        const routeRes = await fetch(osrmUrl);
        const routeData = await routeRes.json();

        if (routeData.routes && routeData.routes.length > 0) {
          const coordinates = routeData.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
          const distanceKm = (routeData.routes[0].distance / 1000).toFixed(1);
          const durationMin = Math.round(routeData.routes[0].duration / 60);

          // Vẽ tuyến đường màu xanh Neon trên Bản đồ
          if (routePolyline) leafletMap.removeLayer(routePolyline);
          routePolyline = L.polyline(coordinates, { color: '#38bdf8', weight: 6, opacity: 0.85 }).addTo(leafletMap);
          leafletMap.fitBounds(routePolyline.getBounds(), { padding: [30, 30] });

          speakNotification(`Đã tìm thấy đường đến ${destName}. Quãng đường khoảng ${distanceKm} km, mất tầm ${durationMin} phút.`);
          statusTextEl.innerText = `🧭 Đang chỉ đường đến: ${destName} (${distanceKm}km)`;
          statusTextEl.className = "status-box";
        }
      } catch (err) {
        statusTextEl.innerText = "❌ Lỗi kết nối dịch vụ bản đồ";
        speakNotification("Lỗi kết nối khi tìm đường đi.");
      }
    }

    // --- AI TÁM CHUYỆN & PHÂN TÍCH LỆNH (GEMINI FREE API INTEGRATION) ---
    async function chatWithAI(userText) {
      const aiName = aiNameInput.value.trim() || "Jarvis";
      statusTextEl.innerText = `🤖 ${aiName} đang suy nghĩ...`;
      statusTextEl.className = "status-box ai-thinking";

      // Kiểm tra xem lệnh có phải là yêu cầu CHỈ ĐƯỜNG hay không
      const lowerText = userText.toLowerCase();
      if (lowerText.includes("dẫn đường") || lowerText.includes("chỉ đường") || lowerText.includes("đi tới") || lowerText.includes("đường đến")) {
        let destination = userText.replace(/dẫn đường|chỉ đường|đi tới|đường đến|tới|đến/gi, "").trim();
        if (destination.length > 1) {
          await routeToDestination(destination);
          return;
        }
      }

      // Xử lý AI Tám chuyện thông minh qua Gemini API
      try {
        const prompt = `Bạn là trợ lý lái xe AI tên là ${aiName}, thông minh, vui vẻ và hài hước. Người lái xe đang hỏi: "${userText}". Hãy trả lời thật ngắn gọn (dưới 25 từ) để tài xế dễ nghe khi đang lái xe.`;
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyA_YOUR_PUBLIC_KEY_HOLDER`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        
        const data = await response.json();
        let reply = "";
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          reply = data.candidates[0].content.parts[0].text;
        } else {
          reply = `Tôi nghe thấy bạn nói "${userText}". Chúc bạn một chuyến đi an toàn!`;
        }

        statusTextEl.innerText = `🤖 ${aiName}: ${reply}`;
        statusTextEl.className = "status-box";
        speakNotification(reply, true);

      } catch (e) {
        // Fallback nội bộ nếu không có mạng/mã API
        let fallbackReply = `Tôi nghe rõ rồi! Chúc bạn giữ vững tay lái an toàn nhé.`;
        if (lowerText.includes("tốc độ")) fallbackReply = `Tốc độ xe hiện tại là ${currentSpeed} ki lô mét trên giờ.`;
        
        statusTextEl.innerText = `🤖 ${aiName}: ${fallbackReply}`;
        statusTextEl.className = "status-box";
        speakNotification(fallbackReply, true);
      }
    }

    // --- TRỢ LÝ GIỌNG NÓI VOICE RECOGNITION ---
    function initVoiceAssistant() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        chatWithAI(transcript);
      };

      recognition.onend = () => {
        if (isVoiceActive) {
          voiceBtn.classList.remove('active');
          voiceBtn.innerText = "🎤 AI TÁM CHUYỆN / CHỈ ĐƯỜNG";
          isVoiceActive = false;
        }
      };
    }

    voiceBtn.addEventListener('click', () => {
      if (!recognition) initVoiceAssistant();
      if (!isVoiceActive) {
        try {
          recognition.start();
          isVoiceActive = true;
          voiceBtn.classList.add('active');
          voiceBtn.innerText = "🎙️ ĐANG NGHE... NÓI ĐI BẠN";
        } catch (e) {}
      } else {
        recognition.stop();
        isVoiceActive = false;
        voiceBtn.classList.remove('active');
        voiceBtn.innerText = "🎤 AI TÁM CHUYỆN / CHỈ ĐƯỜNG";
      }
    });

    function speakNotification(text, forceSpeak = false) {
      if (!isSoundEnabled && !forceSpeak) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'vi-VN';
        msg.rate = 1.15;
        window.speechSynthesis.speak(msg);
      }
    }

    function updateSpeedDisplay(speed) {
      speedValueText.innerText = speed.toString();
      const tolerance = parseInt(toleranceSelect.value);
      if (SPEED_LIMIT > 0 && speed > (SPEED_LIMIT + tolerance)) speedValueText.classList.add('overspeed');
      else speedValueText.classList.remove('overspeed');
    }

    function getSmoothedSpeed(rawSpeed) {
      if (rawSpeed === null || rawSpeed < 0) rawSpeed = 0;
      let kmh = Math.round(rawSpeed * 3.6);
      speedBuffer.push(kmh);
      if (speedBuffer.length > 4) speedBuffer.shift();
      return Math.round(speedBuffer.reduce((a, b) => a + b, 0) / speedBuffer.length);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function playAlertBeep() {
      if (!isSoundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    }

    // Canvas PiP Gauge Rendering
    function renderPiPGauge() {
      const tolerance = parseInt(toleranceSelect.value);
      const isOver = SPEED_LIMIT > 0 && currentSpeed > (SPEED_LIMIT + tolerance);

      ctxG.fillStyle = '#020617'; ctxG.fillRect(0, 0, 300, 300);
      ctxG.lineWidth = 12; ctxG.strokeStyle = isOver ? '#ef4444' : '#38bdf8'; ctxG.strokeRect(6, 6, 288, 288);
      ctxG.fillStyle = isOver ? '#ef4444' : '#38bdf8'; ctxG.font = '900 120px sans-serif'; ctxG.textAlign = 'center'; ctxG.textBaseline = 'middle';
      ctxG.fillText(currentSpeed.toString(), 150, 130);
      ctxG.fillStyle = '#94a3b8'; ctxG.font = '700 24px sans-serif'; ctxG.fillText('km/h', 150, 205);
      ctxG.fillStyle = '#ef4444'; ctxG.font = 'bold 22px sans-serif'; ctxG.fillText(`GIỚI HẠN: ${SPEED_LIMIT}`, 150, 245);

      pipAnimationId = requestAnimationFrame(renderPiPGauge);
    }

    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else {
          if (pipAnimationId) cancelAnimationFrame(pipAnimationId);
          renderPiPGauge();
          const stream = canvasGauge.captureStream(30);
          hiddenVideo.srcObject = stream;
          await hiddenVideo.play();
          await hiddenVideo.requestPictureInPicture();
        }
      } catch (err) { alert("Thiết bị không hỗ trợ PiP Popup: " + err.message); }
    }
    pipBtn.addEventListener('click', togglePiP);

    function toggleHudMode() {
      isHudMode = !isHudMode;
      if (isHudMode) { dashboardContainer.classList.add('hud-mode'); hudBtn.innerText = "🕶️ TẮT HUD"; }
      else { dashboardContainer.classList.remove('hud-mode'); hudBtn.innerText = "🕶️ KÍNH HUD"; }
    }
    hudBtn.addEventListener('click', toggleHudMode);

    // Track positioning & Background Lifecycle
    function startTracking() {
      if (!navigator.geolocation) { statusTextEl.innerText = "❌ Không hỗ trợ GPS"; return; }

      enableBackgroundEngine(); // Kích hoạt chạy ngầm liên tục
      tripStartTime = Date.now(); totalDistanceKm = 0; tripMaxSpeed = 0; overSpeedCount = 0; lastCoords = null; speedBuffer = [];
      statusTextEl.innerText = "📡 Đang định vị GPS...";

      initMap(currentLat, currentLon);

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          updateMapPosition(lat, lon);

          if (lastCoords) {
            const dist = calculateDistance(lastCoords.lat, lastCoords.lon, lat, lon);
            if (dist < 1) totalDistanceKm += dist;
          }
          lastCoords = { lat, lon };

          currentSpeed = getSmoothedSpeed(position.coords.speed);
          if (currentSpeed > tripMaxSpeed) tripMaxSpeed = currentSpeed;
          
          updateSpeedLimitAuto();

          const tolerance = parseInt(toleranceSelect.value);
          if (SPEED_LIMIT > 0 && currentSpeed > (SPEED_LIMIT + tolerance)) {
            overSpeedCount++;
            statusTextEl.innerText = `⚠️ QUÁ TỐC ĐỘ: ${currentSpeed}/${SPEED_LIMIT} km/h!`;
            statusTextEl.className = "status-box overspeed";
            playAlertBeep();
          } else {
            if (!statusTextEl.className.includes("ai-thinking")) {
              statusTextEl.innerText = "🟢 Tốc độ an toàn";
              statusTextEl.className = "status-box";
            }
          }
        },
        () => { statusTextEl.innerText = "❌ Mất tín hiệu GPS!"; },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );

      startBtn.style.display = 'none';
      aiToggleBtn.style.display = 'flex'; voiceBtn.style.display = 'flex';
      pipBtn.style.display = 'flex'; hudBtn.style.display = 'flex'; stopBtn.style.display = 'flex';
    }

    function stopTracking() {
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      disableBackgroundEngine();
      if (document.pictureInPictureElement) document.exitPictureInPicture();
      
      const durationMin = Math.round((Date.now() - tripStartTime) / 60000);
      document.getElementById('statTime').innerText = `${durationMin} phút`;
      document.getElementById('statDistance').innerText = `${totalDistanceKm.toFixed(2)} km`;
      document.getElementById('statMaxSpeed').innerText = `${tripMaxSpeed} km/h`;
      document.getElementById('statViolations').innerText = `${Math.round(overSpeedCount / 3)} lần`;
      tripModal.style.display = 'flex';
    }

    closeModalBtn.addEventListener('click', () => {
      tripModal.style.display = 'none';
      currentSpeed = 0; updateSpeedDisplay(0); updateSpeedLimitAuto();
      startBtn.style.display = 'flex';
      aiToggleBtn.style.display = 'none'; voiceBtn.style.display = 'none';
      pipBtn.style.display = 'none'; hudBtn.style.display = 'none'; stopBtn.style.display = 'none';
    });

    updateSpeedLimitAuto();
    startBtn.addEventListener('click', startTracking);
    stopBtn.addEventListener('click', stopTracking);
  </script>
</body>
